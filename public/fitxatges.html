<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fitxatges GPS</title><link rel="stylesheet" href="/styles.css"></head><body><main><div class="loginBox panel"><h1>FITXATGES GPS</h1><p>El GPS només es consulta quan prems un botó.</p><div><label>Codi d’empleat</label><input id="code" inputmode="numeric" placeholder="001"></div><div class="punchGrid" style="margin-top:15px"><button class="btn punchBtn" data-type="ENTRADA">ENTRADA</button><button class="btn gold punchBtn" data-type="PAUSA">PAUSA</button><button class="btn secondary punchBtn" data-type="TORNAR">TORNAR</button><button class="btn bad punchBtn" data-type="SORTIDA">SORTIDA</button></div><div id="result" style="margin-top:14px"></div><p><a href="/#punches">← Tornar a l’app</a></p></div></main><script>const result=document.getElementById('result');async function send(type,pos,error){try{const body={code:document.getElementById('code').value.trim(),type};if(pos){body.lat=pos.coords.latitude;body.lng=pos.coords.longitude;body.accuracy=pos.coords.accuracy}else body.gpsError=error||'No disponible';const r=await fetch('/api/punch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Error');result.className='okBox';result.innerHTML='<b>'+d.punch.type+' registrada</b><br>'+d.punch.employeeName+'<br>'+d.punch.status+(d.punch.distance==null?'':' · '+d.punch.distance+' m')}catch(e){result.className='errBox';result.textContent=e.message}}document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{const type=b.dataset.type;if(!document.getElementById('code').value.trim())return alert('Escriu el codi.');result.className='notice';result.textContent='Localitzant...';if(!navigator.geolocation)return send(type,null,'GPS no disponible');navigator.geolocation.getCurrentPosition(p=>send(type,p),e=>send(type,null,e.message),{enableHighAccuracy:true,timeout:10000,maximumAge:0})});</script></body></html>
