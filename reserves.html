<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Casa Mestres · Reserves</title><style>
:root{--wine:#7b1730;--cream:#f7f0e4;--gold:#b89554;--ink:#332b27;--line:#ddcfb7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:20px}.head{text-align:center;padding:18px 0 25px}.head h1{font-family:Georgia,serif;font-size:40px;margin:0;color:var(--wine)}.head p{letter-spacing:4px;color:var(--gold)}.card{background:#fffdf8;border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:16px;box-shadow:0 12px 30px #5a442414}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;margin:12px 0 6px;color:#6a615b}input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fffaf2;font:inherit}.btn{width:100%;border:0;border-radius:16px;padding:16px;background:var(--wine);color:white;font-size:18px;font-weight:800;margin-top:16px}.menuInfo,.notice{border-left:5px solid var(--gold);background:#f5ead8;padding:13px;border-radius:14px;margin-top:14px}.muted{color:#776e67;font-size:13px}.hidden{display:none}.ok{background:#e5f2e8;border:1px solid #a8cdb0;padding:14px;border-radius:14px}.err{background:#f8e5e3;border:1px solid #d6a09b;padding:14px;border-radius:14px}@media(max-width:620px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.head h1{font-size:34px}}</style></head><body><div class="wrap"><header class="head"><h1 id="brand">Casa Mestres</h1><p>CUINA D’AUTOR · RESERVES</p></header><div id="app" class="card">Carregant...</div></div><script>
let cfg=null;const euro=n=>(Number(n)||0).toFixed(2).replace('.',',')+' €';const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(p,o={}){const r=await fetch(p,{headers:{'Content-Type':'application/json'},...o}),t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.error||'Error');return d}
function render(){const menus=cfg.menus||[],max=cfg.config.maxPax||10;document.getElementById('brand').textContent=cfg.company.name||'Casa Mestres';document.getElementById('app').innerHTML=`<h2>Reserva amb confirmació</h2><p>Selecciona dia, hora, comensals i menú.</p><div class="grid"><div><label>Data</label><input id="date" type="date" min="${new Date().toISOString().slice(0,10)}"></div><div><label>Hora</label><select id="time"><option>13:30</option><option>14:00</option><option>14:30</option><option>20:30</option><option>21:00</option><option>21:30</option></select></div><div><label>Persones</label><select id="pax">${Array.from({length:max},(_,i)=>`<option>${i+1}</option>`).join('')}</select></div><div><label>Zona</label><select id="zone"><option>Sala principal</option><option>Terrassa</option></select></div></div><label>Menú / servei</label><select id="menu">${menus.map(m=>`<option value="${esc(m.id)}">${esc(m.title)} · ${euro(m.price)}</option>`).join('')}</select><div id="menuInfo" class="menuInfo"></div><div class="notice">Per a més de <b>${max} persones</b>, reserva de grup. Contacta amb el restaurant: <b>${esc(cfg.config.groupPhone||cfg.company.phone||'')}</b>.</div><hr><label>Nom i cognoms</label><input id="name"><label>Telèfon / WhatsApp</label><input id="phone" inputmode="tel"><label>Email</label><input id="email" type="email"><label>Observacions</label><textarea id="notes"></textarea><label><input id="terms" type="checkbox" style="width:auto"> Accepto les condicions de reserva i cancel·lació.</label><p class="muted">${esc(cfg.config.cancellationPolicy||'')}</p><label><input id="marketing" type="checkbox" style="width:auto"> Accepto rebre comunicacions comercials. Opcional.</label><button id="submit" class="btn">Continuar reserva</button><div id="result"></div>`;['menu','pax'].forEach(id=>document.getElementById(id).addEventListener('change',update));document.getElementById('submit').onclick=submit;update()}
function update(){const m=cfg.menus.find(x=>x.id===document.getElementById('menu').value),p=Number(document.getElementById('pax').value||1);if(!m){document.getElementById('menuInfo').innerHTML='No hi ha menús publicats.';return}const dep=m.depositType==='percent'?m.price*p*(m.depositValue||0)/100:p*(m.depositValue||0);document.getElementById('menuInfo').innerHTML=`<b>${esc(m.title)}</b> · ${euro(m.price)} per persona<br>Fiança calculada per ${p} pax: <b>${euro(dep)}</b>${m.notes?`<p>${esc(m.notes)}</p>`:''}`}
async function submit(){const out=document.getElementById('result');out.className='';out.textContent='';const $=id=>document.getElementById(id);if(!$('terms').checked){out.className='err';out.textContent='Cal acceptar les condicions.';return}try{const d=await api('/api/reservations',{method:'POST',body:JSON.stringify({date:$('date').value,time:$('time').value,pax:Number($('pax').value),zone:$('zone').value,menuId:$('menu').value,name:$('name').value,phone:$('phone').value,email:$('email').value,notes:$('notes').value,marketing:$('marketing').checked})});if(d.checkoutUrl){out.className='ok';out.innerHTML=`<b>Reserva creada.</b><br>Obrint Stripe…<br>Fiança: <b>${euro(d.reservation.depositAmount)}</b>`;window.location.href=d.checkoutUrl;return}out.className='ok';out.innerHTML=`<b>Reserva registrada.</b><br>${esc(d.message)}<br>Fiança: <b>${euro(d.reservation.depositAmount)}</b>`}catch(e){out.className='err';out.textContent=e.message}}
const qs=new URLSearchParams(location.search);
if(qs.get('stripe')==='success'&&qs.get('session_id')){
 document.getElementById('app').innerHTML='<div class="ok"><b>Comprovant pagament Stripe…</b></div>';
 api('/api/stripe/confirm?session_id='+encodeURIComponent(qs.get('session_id'))).then(d=>{
  if(d.paid)document.getElementById('app').innerHTML=`<div class="ok"><h2>Reserva confirmada</h2><p>Pagament rebut correctament.</p><p><b>${esc(d.reservation.name)}</b> · ${esc(d.reservation.date)} ${esc(d.reservation.time)} · ${d.reservation.pax} pax</p><p>Fiança pagada: <b>${euro(d.reservation.depositAmount)}</b></p></div>`;
  else document.getElementById('app').innerHTML='<div class="err">Stripe encara no confirma el pagament. Torna a Gestió de reserves per comprovar-ne l\'estat.</div>';
 }).catch(e=>document.getElementById('app').innerHTML=`<div class="err">${esc(e.message)}</div>`);
}else{
 api('/api/reservation-config').then(d=>{cfg=d;render()}).catch(e=>document.getElementById('app').innerHTML=`<div class="err">${esc(e.message)}</div>`);
}
</script></body></html>
